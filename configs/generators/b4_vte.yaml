id: b4_vte
schema_version: v1
kind: generator
code: b4_vte
llm_dependent: true
params:
  top_k: 5
  temperature: 0
  # Reply cap (amendment 0007). The provider default of 160 tokens cut off every
  # B4/B5 and most B3 explanation; generation stops at end-of-text, so a high cap
  # costs time only on texts that are really that long.
  max_new_tokens: 1024
prompt:
  name: b4_vte/generator
  version: 1.0.0
  sha256: 17d1443863464e2dd3251f560d5cfe5c149f323c6344c19d50f9f808f338c256
# Selected at runtime for K-way runs (see b3_dte_style.yaml for the rationale).
# The verifier prompt below needs NO variant: its checks are class-agnostic
# (features present? directions match the evidence signs?).
prompt_multiclass:
  name: b4_vte/generator
  version: 1.1.0
  sha256: 9b7841148c35318c5e24c22179265c92f249262aec0518f5fbb7d2cd7af697aa
# KB grounding source (feature-semantics), versioned. The per-dataset dictionary
# is selected at run time from the dataset's kb_ref; this pins the KB version.
kb_ref: kb:feature_semantics@1.1.0
verifier:
  # FIREWALL SIDE A. model_family here must be disjoint from every generator LLM
  # family AND from the extractor's family (tools/firewall_check.py).
  model_family: phi
  prompt:
    name: b4_vte/verifier
    version: 1.0.0
    sha256: cb7f40facd0a874dfa9f567513747204021d2a27564f68411cc4bd87b3f8fc2a
  threshold_ref: statistics:decision_thresholds:verifier_threshold
  threshold_scope: dev_split
  # AMENDMENT 0008 (2026-10-03): the phi verifier's pinned model. Microsoft
  # publishes no 4-bit file, so this is Ollama's library build of the official
  # weights, pinned by blob sha256 (a moved tag is refused, not followed). It
  # runs in the Tier-A SCORE step: B4 makes one draft call, then the verifier
  # reads it, so verifying after generation is the same instrument. The verdict
  # is a token (SUPPORTED/UNSUPPORTED) — there is no score for threshold_ref's
  # three levels to cut; amendment 0008 records that.
  model:
    id: vte_verifier_phi4_mini
    provider: local_open_weights
    quantisation: 4bit
    runtime: ollama
    base_model: microsoft/Phi-4-mini-instruct
    licence: MIT
    weights:
      source: ollama_library
      ref: phi4-mini:3.8b-q4_K_M
      revision: sha256-3c168af1dea0a414299c7d9077e100ac763370e5a98b3c53801a958a47f0a5db
      sha256: 3c168af1dea0a414299c7d9077e100ac763370e5a98b3c53801a958a47f0a5db
    ollama:
      model_name: phi4-mini:3.8b-q4_K_M
      template_sha256: 813f53fdc6e58d35bb1c3853c93266380e9ca918a993e8eab193e8ede5d3a603
      params_sha256: null
      min_version: 0.30.5
      think: null
abstention:
  enabled: true
  fallback_generator: b1_template
  reporting: coverage_risk
